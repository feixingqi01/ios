name: Build Cryptomator IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.1
        
    - name: Install CocoaPods
      run: gem install cocoapods
        
    - name: Install Pods
      working-directory: ios
      run: pod install
        
    - name: Build with Fastlane
      uses: maierj/fastlane-action@v2.3.0
      with:
        lane: build_ipa
        options: '{"workspace":"ios/Cryptomator.xcworkspace","scheme":"Cryptomator","export_method":"development"}'
        
    - name: Upload IPA
      uses: actions/upload-artifact@v3
      with:
        name: Cryptomator-iOS
        path: ios/Cryptomator.ipa
