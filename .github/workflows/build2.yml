name: Build Unsigned IPA

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]  # 在 main 分支 push 时触发

jobs:
  build:
    runs-on: macos-latest  # 必须使用 macOS 环境
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install CocoaPods
      run: sudo gem install cocoapods

    - name: Install Dependencies
      run: pod install

    - name: Build Xcode Archive (Unsigned)
      run: |
        xcodebuild -workspace Cryptomator.xcworkspace \
                   -scheme Cryptomator \
                   -configuration Release \
                   -archivePath Cryptomator.xcarchive \
                   archive

    - name: Export Unsigned IPA
      run: |
        xcodebuild -exportArchive \
                   -archivePath Cryptomator.xcarchive \
                   -exportPath . \
                   -exportOptionsPlist ExportOptions.plist

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Cryptomator-Unsigned-IPA
        path: Cryptomator.ipa
